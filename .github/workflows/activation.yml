name: Acquire Unity License
on: workflow_dispatch

jobs:
  acquire_ulf:
    name: Acquire .ulf file
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Activate the license
        run: |
          unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" "${{ secrets.UNITY_LICENSE }}"

      - name: Read .ulf file
        id: ulfRead
        uses: juliangruber/read-file-action@v1.1.4
        with:
          path: ${{ env.ULF_FILE }}

      - name: Update UNITY_LICENSE secret
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'UNITY_LICENSE'
          value: '${{ steps.ulfRead.outputs.content }}'
          token: ${{ secrets.ACCESS_TOKEN }}
